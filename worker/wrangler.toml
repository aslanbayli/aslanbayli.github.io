name = "ali-knowledge-chat"
main = "src/index.ts"
compatibility_date = "2026-07-27"

[ai]
binding = "AI"

[[vectorize]]
binding = "KNOWLEDGE_INDEX"
index_name = "ali-public-knowledge"

[vars]
PUBLIC_ORIGIN = "https://aslanbayli.github.io"
MAX_REQUESTS_PER_WINDOW = "20"
WINDOW_SECONDS = "3600"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1
